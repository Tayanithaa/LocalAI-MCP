<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local AI Workspace</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon"></div>
                <h2>Local AI</h2>
            </div>
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span>MCP Connected</span>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <header class="chat-header">
                <h1>Workspace Assistant</h1>
                <p>Ollama + MCP Tools (Gmail, Calendar, Spotify, YouTube...)</p>
            </header>

            <div class="chat-box" id="chat-box">
                <!-- Initial Welcome Message -->
                <div class="message assistant-message">
                    <div class="avatar">AI</div>
                    <div class="bubble">
                        <p>Hello! I am your local AI workspace assistant. I can search GitHub, read your emails, check your calendar, control Spotify, and more.</p>
                        <p>What would you like to do today?</p>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-container">
                <form id="chat-form">
                    <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off">
                    <button type="submit" id="send-button">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </form>
            </div>
        </main>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
